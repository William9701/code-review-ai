name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Linting and Code Quality
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy isort

      - name: Run Black
        run: black --check .

      - name: Run Flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503

      - name: Run isort
        run: isort --check-only --profile black .

  # Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_DATABASE: codereview_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          find services -name requirements.txt -exec pip install -r {} \;

      - name: Run tests
        env:
          MONGODB_URL: mongodb://localhost:27017/codereview_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v --cov=services --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: |
          find . -name requirements.txt -exec safety check -r {} \; || true

      - name: Run Bandit security linter
        run: bandit -r services/ shared/ -ll

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Webhook Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/webhook/Dockerfile
          push: false
          tags: codereview-ai/webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Analysis Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/analysis-engine/Dockerfile
          push: false
          tags: codereview-ai/analysis-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build LLM Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/llm-service/Dockerfile
          push: false
          tags: codereview-ai/llm-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build GitHub Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/github-service/Dockerfile
          push: false
          tags: codereview-ai/github-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration Tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
          sleep 30

      - name: Run integration tests
        run: |
          pip install pytest httpx
          pytest tests/integration/ -v

      - name: Stop services
        if: always()
        run: docker-compose down -v

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: codereview-mongodb
    environment:
      MONGO_INITDB_DATABASE: codereview
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codereview-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: codereview-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codereview-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: codereview-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-codereview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codereview-network

  # Webhook Service
  webhook-service:
    build:
      context: .
      dockerfile: ./services/webhook/Dockerfile
    container_name: codereview-webhook
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - SERVICE_NAME=webhook-service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # Analysis Engine
  analysis-engine:
    build:
      context: .
      dockerfile: ./services/analysis-engine/Dockerfile
    container_name: codereview-analysis
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - SERVICE_NAME=analysis-engine
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # LLM Service
  llm-service:
    build:
      context: .
      dockerfile: ./services/llm-service/Dockerfile
    container_name: codereview-llm
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-3-5-sonnet-20241022}
      - SERVICE_NAME=llm-service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # GitHub Service
  github-service:
    build:
      context: .
      dockerfile: ./services/github-service/Dockerfile
    container_name: codereview-github
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - SERVICE_NAME=github-service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # Orchestrator Service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codereview-orchestrator
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - SERVICE_NAME=orchestrator
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # API Service
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codereview-api
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-changeme-use-strong-secret}
      - SERVICE_NAME=api-service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codereview-notification
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/codereview
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-codereview}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SERVICE_NAME=notification-service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codereview-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: codereview-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - codereview-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: codereview-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - codereview-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  codereview-network:
    driver: bridge

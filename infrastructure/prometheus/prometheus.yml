global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'codereview-ai'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Webhook Service
  - job_name: 'webhook-service'
    static_configs:
      - targets: ['webhook-service:8000']
    metrics_path: '/metrics'

  # Analysis Engine
  - job_name: 'analysis-engine'
    static_configs:
      - targets: ['analysis-engine:8000']
    metrics_path: '/metrics'

  # LLM Service
  - job_name: 'llm-service'
    static_configs:
      - targets: ['llm-service:8000']
    metrics_path: '/metrics'

  # GitHub Service
  - job_name: 'github-service'
    static_configs:
      - targets: ['github-service:8000']
    metrics_path: '/metrics'

  # API Service
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8000']
    metrics_path: '/metrics'

  # PostgreSQL Exporter (if added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis Exporter (if added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
